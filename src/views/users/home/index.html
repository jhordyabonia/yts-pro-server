<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - YTS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="bg-gradient-custom text-white min-h-screen">
    <nav class="bg-gray-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold">YTS Pro</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="../settings/" class="hover:text-gray-300">Configuración</a>
                    <button id="logout-btn" class="hover:text-gray-300">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-bold mb-4">Mi Contrato</h2>
                <div id="contract-info" class="space-y-4">
                    <!-- Contract info will be loaded here -->
                </div>
            </div>
            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-bold mb-4">Estadísticas</h2>
                <div id="stats" class="space-y-4">
                    <!-- Stats will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <script src="home.js"></script>
</body>
</html>
