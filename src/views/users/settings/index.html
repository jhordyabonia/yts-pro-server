<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - YTS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="bg-gradient-custom text-white min-h-screen">
    <nav class="bg-gray-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold">YTS Pro</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="../home/" class="hover:text-gray-300">Inicio</a>
                    <button id="logout-btn" class="hover:text-gray-300">Cerrar Sesión</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="max-w-lg mx-auto">
            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-bold mb-6">Configuración de Cuenta</h2>
                <form id="settings-form" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium mb-2">Email</label>
                        <input type="email" id="email" readonly
                               class="w-full bg-gray-700 rounded p-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Nueva Contraseña</label>
                        <input type="password" id="new-password" 
                               class="w-full bg-gray-700 rounded p-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Confirmar Contraseña</label>
                        <input type="password" id="confirm-password" 
                               class="w-full bg-gray-700 rounded p-3">
                    </div>
                    <div id="error-message" class="text-red-500 text-sm hidden"></div>
                    <div id="success-message" class="text-green-500 text-sm hidden"></div>
                    <button type="submit" 
                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg">
                        Guardar Cambios
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="settings.js"></script>
</body>
</html>
