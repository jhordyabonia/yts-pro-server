<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Login - YTS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="bg-gradient-custom text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md p-6">
        <div class="bg-gray-800 rounded-lg shadow-xl p-8">
            <h2 class="text-2xl font-bold text-center mb-6">Partner Login</h2>
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium mb-2">Código de Partner</label>
                    <input type="text" id="code" 
                           class="w-full bg-gray-700 rounded p-3" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Contraseña</label>
                    <input type="password" id="password" 
                           class="w-full bg-gray-700 rounded p-3" required>
                </div>
                <div id="error-message" class="text-red-500 text-sm hidden"></div>
                <button type="submit" 
                        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-lg">
                    Ingresar como Partner
                </button>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
